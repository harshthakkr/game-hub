name: Price tracker

# Price sweep every 3 hours, run as a script straight against the database
# (so it isn't bound by the 60s serverless limit and doesn't depend on the
# deploy). Every 3 hours rather than hourly keeps the database's awake time
# (Neon compute) low; store prices rarely change more often than that.
#
# - Hot listings (wishlisted, in a library, or viewed in the last 14 days)
#   are re-checked every run.
# - The rest of the tracked catalogue is re-checked once a day.
# - Once a day (the 21:07 UTC run, ~02:37 IST) the popular catalogue is
#   seeded from IGDB first, so popular games have prices before anyone
#   opens them.
#
# Scheduled workflows only run from the default branch.
# Repository secrets: DATABASE_URL, IGDB_CLIENT_ID, IGDB_CLIENT_SECRET.
on:
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: Seed the popular catalogue before sweeping
        type: boolean
        default: false

# Never overlap two sweeps.
concurrency:
  group: price-tracker
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sweep prices
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          NEXT_PUBLIC_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          NEXT_PUBLIC_BASE_URL: https://api.igdb.com/v4
          SEED_LIMIT: 2000
          BUDGET_MINUTES: 20
        run: |
          if [ "$(date -u +%H)" = "21" ] || [ "${{ inputs.seed }}" = "true" ]; then
            npx tsx scripts/price-sweep.ts --seed
          else
            npx tsx scripts/price-sweep.ts
          fi
